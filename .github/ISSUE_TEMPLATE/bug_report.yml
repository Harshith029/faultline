name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Config used (secrets removed)
        2. Command run
        3. What appeared
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines. The agent logs structured JSON; `--pretty` makes it
        readable. Please remove tokens and webhook URLs.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 20.19, Ubuntu 24.04, Docker image, Kubernetes…
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Telemetry source
      options: [synthetic, prometheus, cloudwatch, http, not applicable]
    validations:
      required: true
